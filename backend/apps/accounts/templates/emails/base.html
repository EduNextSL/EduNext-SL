<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site_name }}</title>
</head>
<body style="margin:0;padding:0;background:#efeff2;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#0d1235;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#efeff2;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td align="center" style="background:#31315f;padding:20px;">
          {% if logo_url %}<img src="{{ logo_url }}" alt="{{ site_name }}" height="48" style="height:48px;border:0;display:block;">{% else %}<span style="color:#ffffff;font-size:22px;font-weight:700;">{{ site_name }}</span>{% endif %}
        </td></tr>
        <tr><td style="padding:32px 28px 12px 28px;font-size:16px;line-height:1.55;">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:12px 28px 28px 28px;font-size:12px;line-height:1.5;color:#6b7280;">
          You are receiving this email because of activity on your {{ site_name }} account.
          Need help? Contact us at <a href="mailto:{{ support_email }}" style="color:#2d5e9c;">{{ support_email }}</a>.<br>
          &copy; {{ year }} {{ site_name }}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
